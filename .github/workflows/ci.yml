name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        # release: optimizers expose bugs Debug hides (e.g. FMA contraction on arm64 macos-14).
        preset: [dev, asan, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew list ninja || brew install ninja

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('third-party/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  wasm:
    name: wasm (Emscripten + Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/.local/share/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/install_emsdk.sh') }}

      - name: Install pinned emsdk
        run: sh scripts/install_emsdk.sh

      - name: Configure, build, test (Node)
        run: |
          . "$HOME/.local/share/emsdk/emsdk_env.sh"
          cmake --preset wasm
          cmake --build --preset wasm
          ctest --preset wasm

  lint:
    name: format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install pinned clang-format and clang-tidy
        run: |
          sh scripts/install_dev_tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: clang-format --dry-run --Werror $(git ls-files '*.hpp' '*.cpp')

      - name: Configure
        run: cmake --preset dev

      - name: clang-tidy
        run: sh scripts/run_clang_tidy.sh

  commit-gate:
    name: commit gate self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Verify the pre-commit gate
        run: sh scripts/verify_commit_gate.sh
