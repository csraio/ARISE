name: CI

# Pull requests only: main takes changes only through PRs, and branch protection requires
# a PR to be up to date with main before merging, so the merged tree is exactly the one
# the PR run tested. A push run on main would repeat that run. Run by hand if ever needed.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    # Caps a hung or pathologically slow job; the slowest (x86 asan) takes ~12 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pinned images, not *-latest, so the compiler only changes on purpose. The arm64
        # image (free for public repos) keeps a non-x86 target in CI: it is where FMA
        # contraction would change last bits if -ffp-contract=off were ever lost. macOS
        # (Apple clang) is built and tested locally by the developer, not in CI.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        # release: optimizers expose bugs Debug hides (e.g. FMA contraction on arm64).
        preset: [dev, asan, release]
        # ASan on arm64 ran ~100x slower than on x86 with the same GCC 13.3 (PR #22: 431 s
        # against 3.6 s for one test; the job never finished). x86 asan covers memory errors;
        # arm64 is here for dev and release.
        exclude:
          - os: ubuntu-24.04-arm
            preset: asan
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('third-party/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  wasm:
    name: wasm (Emscripten + Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/.local/share/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/install_emsdk.sh') }}

      - name: Install pinned emsdk
        run: sh scripts/install_emsdk.sh

      - name: Configure, build, test (Node)
        run: |
          . "$HOME/.local/share/emsdk/emsdk_env.sh"
          cmake --preset wasm
          cmake --build --preset wasm
          ctest --preset wasm

  lint:
    name: format + clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install pinned clang-format and clang-tidy
        run: |
          sh scripts/install_dev_tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: clang-format --dry-run --Werror $(git ls-files '*.hpp' '*.cpp')

      - name: Configure
        run: cmake --preset dev

      - name: clang-tidy
        run: sh scripts/run_clang_tidy.sh

  commit-gate:
    name: commit gate self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Verify the pre-commit gate
        run: sh scripts/verify_commit_gate.sh
